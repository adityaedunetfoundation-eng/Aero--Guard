services:
  - type: web
    name: aeroguard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT --timeout 180
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: GROQ_API_KEY
        sync: false
